name: Setup PHP
description: Shared steps to set up PHP, its extension cache and the dependencies

inputs:
  php:
    required: true
  extensions:
    required: false
    default: "mbstring"
  tools:
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup PHP cache environment
      id: php-cache
      uses: shivammathur/cache-extensions@d894929efeece5f8d386bd667369b321947064ad # v1.15.6
      with:
        php-version: ${{ inputs.php }}
        extensions: ${{ inputs.extensions }}
        key: php-v1

    - name: Cache PHP extensions
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.php-cache.outputs.dir }}
        key: ${{ steps.php-cache.outputs.key }}
        restore-keys: ${{ steps.php-cache.outputs.key }}

    - name: Setup PHP environment
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
      with:
        php-version: ${{ inputs.php }}
        extensions: ${{ inputs.extensions }}
        coverage: none
        tools: ${{ inputs.tools }}

    - name: Get the Composer cache directory
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Install dependencies
      shell: bash
      run: composer install --prefer-dist
